[project]
name = "voiceops"
version = "0.2.0"
description = "Voice + messaging AI agents that complete property-management workflows against a legacy system of record"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["voiceops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["F", "E9", "B"]
