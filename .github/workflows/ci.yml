name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check voiceops tests
      - name: Unit tests
        run: VOICEOPS_MODEL_PROVIDER=scripted python -m pytest -q
      - name: Offline eval regression (scripted model, no API key needed)
        run: python -m voiceops.evals --compare evals/baseline.scripted.json
      - name: Live-model evals (only when an API key secret is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m voiceops.evals --provider claude --trials 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/
